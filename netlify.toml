[build]
  publish = "dist-netlify"
  functions = "netlify/functions"
  command = "npm run build"

[functions]
  node_bundler = "esbuild"
  included_files = ["public/archive/**", "public/media/**"]

[[redirects]]
  from = "/archive/*"
  to = "/.netlify/functions/files?path=/archive/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/media/*"
  to = "/.netlify/functions/files?path=/media/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/archive/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
